name: Record city poll vote

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One vote at a time so concurrent votes cannot overwrite each other.
concurrency:
  group: poll-results
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, 'Vote: ')
    runs-on: ubuntu-latest
    steps:
      - name: Add the vote to poll-results.json
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const path = "poll-results.json";
            const defaults = ["Seoul", "Tokyo", "Bangkok", "Beijing", "Shanghai", "Dubai", "Sydney", "Taipei", "Guangzhou", "Bali"];
            const maxCustomCities = 60;
            const city = issue.title.slice("Vote: ".length).trim();

            const finish = async (message, close = true) => {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: message });
              if (close) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
            };

            if (!/^[A-Za-z][A-Za-z .'-]{1,39}$/.test(city)) {
              await finish("Vote not counted: the city name is not valid.");
              return;
            }

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: "main" });
            const data = JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8"));
            data.votes = data.votes ?? {};
            data.custom = Array.isArray(data.custom) ? data.custom : [];

            const known = [...defaults, ...data.custom, ...Object.keys(data.votes)];
            const existing = known.find((name) => name.toLowerCase() === city.toLowerCase());
            let key = existing;
            if (!key) {
              if (data.custom.length >= maxCustomCities) {
                await finish("Vote not counted: the list of added cities is full. Ask the admin to tidy it.");
                return;
              }
              key = city;
              data.custom.push(key);
            }
            data.votes[key] = (data.votes[key] ?? 0) + 1;
            data.updated = new Date().toISOString();

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: "main",
              sha: file.data.sha,
              message: `Record vote for ${key}`,
              content: Buffer.from(JSON.stringify(data, null, 2) + "\n").toString("base64")
            });
            await finish(`Thanks! Your vote for ${key} has been counted.`);
