name = "tan-family-poll"
main = "poll-worker.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGINS = "https://jeremytantat.github.io,http://localhost:8080,http://127.0.0.1:8080"

# Run `npx wrangler kv namespace create POLL -c poll-wrangler.toml` and paste the returned id below.
[[kv_namespaces]]
binding = "POLL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
